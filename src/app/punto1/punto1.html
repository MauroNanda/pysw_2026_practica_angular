<div class="container mt-4">
    <h2 class="text-center mb-4">Eventos Disponibles</h2>

    <div class="card mx-auto" style="max-width: 600px;">
        <div style="height: 300px; overflow: hidden;">
            <img [src]="eventoActual.img" class="card-img-top"
                style="width: 100%; height: 100%; object-fit: cover;"
                [alt]="eventoActual.nombre">
        </div>

        <div class="card-body text-center">
            <h5 class="card-title">{{ eventoActual.nombre }}</h5>
            <p class="card-text descripcion-evento">{{ eventoActual.descripcion }}</p>
            <p class="text-muted">{{ indiceActual + 1 }} / {{ eventos.length }}</p>

            <div class="d-flex justify-content-center gap-3">
                <button class="btn btn-secondary" (click)="anterior()">
                    ← Anterior
                </button>
                <button class="btn btn-primary" (click)="siguiente()">
                    Siguiente →
                </button>
            </div>
        </div>
    </div>
</div>
